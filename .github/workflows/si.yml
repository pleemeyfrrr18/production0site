name: Company CI

on:

  push:

    branches:

      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Check Dockerfile

        run: test -f Dockerfile

      - name: Build

        run: docker build -t company-site .

      - name: Run Container

        run: docker run -d --name website -p 8080:80 company-site

      - name: Wait

        run: sleep 5

      - name: Test Website

        run: curl http://localhost:8080

      - name: Show Containers

        run: docker ps
